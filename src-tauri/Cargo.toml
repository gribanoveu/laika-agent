[package]
name = "atlas-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for the transparent (rounded-corner) window.
# Note: it makes the bundle ineligible for the Mac App Store.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignore = "0.4.33"
regex = "1.13.1"
globset = "0.4.20"
similar = "3.2.0"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_path_to_error = "0.1.20"
aes-gcm = "0.10"
zeroize = "1"
rand = "0.8"
dirs = "7.0.0"
keyring = "3"
ureq = { version = "3", features = ["json"] }
secrecy = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Platform keychain backends in keyring 3.x are opt-in features. Without one
# the crate compiles to an in-memory mock whose writes return Ok(()) and
# evaporate at process exit — a store that only pretends to work. The base
# declaration above stays so an unsupported platform still builds, and
# `infra::master_key` detects the mock at runtime and goes to the file fallback
# honestly instead of losing the key silently.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# `sync-secret-service`: a blocking Secret Service client over dbus, since
# there is no free async context here. `crypto-rust` encrypts the dbus
# transport itself without depending on the system OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
